<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>社課簽到</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            background-color: white;
            padding: 25px 20px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
        }

        h2 {
            margin-top: 20px;
        }

        .course {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.8;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input {
            display: block;
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            -webkit-appearance: none;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;

            /* 手機觸控 */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        button:active {
            transform: scale(0.98);
        }

        .login-button {
            background-color: #222;
            color: white;
        }

        .admin-button {
            background-color: #555;
            color: white;
        }

        .course-select-button {
            display: block;
            width: 100%;

            margin-top: 10px;
            padding: 16px;

            border: 2px solid #ddd;
            border-radius: 12px;

            background-color: white;
            color: #222;

            text-align: left;
            font-size: 16px;

            cursor: pointer;

            touch-action: manipulation;
            pointer-events: auto;
        }

        .course-select-button.selected {
            border: 2px solid #222;
            background-color: #f0f0f0;
        }

        .course-select-button:active {
            background-color: #eeeeee;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        #attendanceList {
            margin-top: 20px;
        }

    </style>

</head>


<body>

<div class="container">

    <!-- ========================================== -->
    <!-- 標題 -->
    <!-- ========================================== -->

    <h1>🕺 社課簽到</h1>


    <!-- ========================================== -->
    <!-- 今天課程 -->
    <!-- ========================================== -->

    <div
        class="course"
        id="courseInfo"
    >
        課程載入中...
    </div>


    <!-- ========================================== -->
    <!-- 社員登入 -->
    <!-- ========================================== -->

    <label for="name">
        姓名
    </label>

    <input
        type="text"
        id="name"
        placeholder="請輸入姓名"
        autocomplete="name"
    >


    <label for="loginStudentId">
        學號
    </label>

    <input
        type="text"
        id="loginStudentId"
        placeholder="請輸入學號"
        autocomplete="off"
    >


    <button
        type="button"
        class="login-button"
        id="loginButton"
    >
        繼續
    </button>


    <!-- ========================================== -->
    <!-- 社員資料 -->
    <!-- ========================================== -->

    <div
        id="studentInfo"
        style="
            display:none;
            margin-top:25px;
            text-align:center;
        "
    >

        <hr>

        <p id="welcomeText"></p>

        <p id="lessonText"></p>


        <button
            type="button"
            class="login-button"
            id="checkInButton"
        >
            🕺 我要簽到
        </button>

    </div>


    <!-- ========================================== -->
    <!-- 管理員 -->
    <!-- ========================================== -->

    <hr style="margin-top:30px;">


    <h2 style="text-align:center;">
        🔐 管理員
    </h2>


    <label for="adminPassword">
        管理員密碼
    </label>

    <input
        type="password"
        id="adminPassword"
        placeholder="請輸入管理員密碼"
    >


    <button
        type="button"
        class="admin-button"
        id="adminLoginButton"
    >
        登入管理員
    </button>


    <!-- ========================================== -->
    <!-- 管理員功能 -->
    <!-- ========================================== -->

    <div
        id="adminArea"
        style="display:none;"
    >

        <hr style="margin-top:30px;">


        <h2 style="text-align:center;">
            👑 管理員功能
        </h2>


        <!-- ====================================== -->
        <!-- 社員堂數 -->
        <!-- ====================================== -->

        <label for="adminStudentId">
            社員學號
        </label>

        <input
            type="text"
            id="adminStudentId"
            placeholder="請輸入社員學號"
        >


        <button
            type="button"
            class="admin-button"
            id="showStudentAdminButton"
        >
            👤 查詢社員
        </button>


        <button
            type="button"
            class="admin-button"
            id="addTenLessonsButton"
        >
            ➕ 增加 10 堂
        </button>


        <button
            type="button"
            class="admin-button"
            id="addOneLessonButton"
        >
            ➕ 增加 1 堂
        </button>


        <!-- ====================================== -->
        <!-- 課程管理 -->
        <!-- ====================================== -->

        <hr style="margin-top:30px;">


        <h2 style="text-align:center;">
            📚 課程管理
        </h2>


        <label for="courseName">
            課程名稱
        </label>

        <input
            type="text"
            id="courseName"
            placeholder="例如：Hip Hop"
        >


        <label for="courseDate">
            課程日期
        </label>

        <input
            type="date"
            id="courseDate"
        >


        <label for="checkinStart">
            簽到開始時間
        </label>

        <input
            type="time"
            id="checkinStart"
        >


        <label for="checkinEnd">
            簽到截止時間
        </label>

        <input
            type="time"
            id="checkinEnd"
        >


        <button
            type="button"
            class="admin-button"
            id="createCourseButton"
        >
            📚 建立課程
        </button>


        <button
            type="button"
            class="admin-button"
            id="loadAttendanceButton"
        >
            📋 查看簽到紀錄
        </button>


        <div
            id="attendanceList"
        ></div>

    </div>

</div>

</body>

</html>
